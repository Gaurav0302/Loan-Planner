<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Home loan and offset planner: extra repayments, bonuses, rate changes, timeline of life events and kids' education funds.">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Timbertop Loan Planner</title>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
<style>
/* Layout: tabbed input panel on the left, results on the right; one column on phones. */
:root{
  --bg:#f5f7f4; --surface:#ffffff; --surface2:#eef2ee; --fg:#1b221e; --muted:#5f6a64; --line:#d9e0da;
  --loan:#1f6f50; --loan-soft:#dcefe5; --offset:#2b64a8; --offset-soft:#deebf7; --kids:#c0711a; --kids-soft:#f8e8d2;
  --warn:#b23b3b; --warn-soft:#f6dcdc; --focus:#2b64a8; --alt:#7a4fb5;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131815; --surface:#1b211d; --surface2:#222a25; --fg:#e7ece8; --muted:#98a39c; --line:#2d3731;
    --loan:#58b98c; --loan-soft:#1e3a2c; --offset:#79aae6; --offset-soft:#1f3047; --kids:#e59c4c; --kids-soft:#43301a;
    --warn:#e27070; --warn-soft:#4a2424; --focus:#79aae6; --alt:#b394e8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131815; --surface:#1b211d; --surface2:#222a25; --fg:#e7ece8; --muted:#98a39c; --line:#2d3731;
  --loan:#58b98c; --loan-soft:#1e3a2c; --offset:#79aae6; --offset-soft:#1f3047; --kids:#e59c4c; --kids-soft:#43301a;
  --warn:#e27070; --warn-soft:#4a2424; --focus:#79aae6; --alt:#b394e8; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2{font-family:var(--display);font-weight:500;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:19px}
p{margin:0}
.wrap{max-width:1260px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
header p{color:var(--muted);max-width:62ch}
.layout{display:grid;grid-template-columns:400px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:960px){.panel{position:static;max-height:none}}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{flex:1 0 auto;border:none;border-radius:0;background:none;padding:11px 10px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--loan)}
.tabbody{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.results{display:flex;flex-direction:column;gap:18px;min-width:0}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f .lab{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.f .lab .unit{font-family:var(--mono);font-size:12px}
.f .ctl{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center}
.f input[type=range]{width:100%;accent-color:var(--loan);margin:0;min-width:0}
.f.off input[type=range]{accent-color:var(--offset)}.f.kid input[type=range]{accent-color:var(--kids)}
input[type=number],input[type=month],input[type=text],select{
  font:inherit;font-family:var(--mono);font-size:13.5px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--fg);width:100%;min-width:0}
input[type=number]{text-align:right}
:is(input,select,button):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted)}
.toggle{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--loan);margin:2px 0 0;flex:none}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:7px;padding:6px 10px;font-size:13px}
button.primary{background:var(--loan);border-color:var(--loan);color:#fff}
button.x{border:none;background:none;color:var(--muted);padding:2px 6px;font-size:15px}
button.x:hover{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;padding:5px 9px;border-radius:999px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.ev .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.ev .txt{font-size:13.5px;min-width:0}
.ev .txt b{font-family:var(--mono);font-weight:500}
.ev .edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
details{border:1px solid var(--line);border-radius:8px}
details summary{cursor:pointer;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
details .body{padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px}
.kidblock strong{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
textarea{font:inherit;font-family:var(--mono);font-size:12px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--fg);width:100%;min-height:160px;resize:vertical}
.evlist{display:flex;flex-direction:column;gap:6px}
.empty{font-size:13px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:var(--display);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.hero{border-left:4px solid var(--loan)}
.tile .d{font-size:12.5px;font-family:var(--mono)}.d.good{color:var(--loan)}.d.bad{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 9px;border-radius:999px}
.legend button[aria-pressed=false]{opacity:.45}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--c);display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.chartbox{width:100%;height:360px}
@media (max-width:600px){.chartbox{height:280px}}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:var(--mono);display:grid;grid-template-columns:auto auto;gap:2px 12px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.tip b{grid-column:1/-1;font-family:var(--body);font-weight:600;margin-bottom:2px}
.tip span:nth-child(odd){color:var(--muted)}
.tip span:nth-child(even){text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.budget{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-variant-numeric:tabular-nums;font-size:14px}
.budget div:nth-child(even){font-family:var(--mono);text-align:right}
.budget .sum{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.neg{color:var(--warn)}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--loan-soft);color:var(--loan)}
.pill.warn{background:var(--kids-soft);color:var(--kids)}.pill.bad{background:var(--warn-soft);color:var(--warn)}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kidcard{border-left:4px solid var(--kids)}
.kidcard .big{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kidcard dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font-size:13.5px}
.kidcard dt{color:var(--muted)}.kidcard dd{margin:0;font-family:var(--mono);text-align:right}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:640px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td{font-family:var(--mono)}
tr.paid td{color:var(--loan);font-weight:500}
.note{font-size:13px;color:var(--muted);max-width:72ch}
.scen{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.scen .sw{width:12px;height:12px;border-radius:3px}
.kidblock{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
</style>

<div class="wrap" id="root"><p class="hint">Loading…</p></div>

<script>
(function(){
const {useState,useEffect,useMemo,useRef}=React;
const html=htm.bind(React.createElement);
const R=window.Recharts;

/* ---------- helpers ---------- */
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ym=s=>{const [y,m]=String(s).split("-").map(Number);return y*12+(m-1);};
const idx2ym=i=>Math.floor(i/12)+"-"+String(i%12+1).padStart(2,"0");
const label=i=>MONTHS[i%12]+" "+Math.floor(i/12);
const fmt=n=>"$"+Math.round(n).toLocaleString("en-AU");
const fmtK=n=>Math.abs(n)>=1e6?"$"+(n/1e6).toFixed(2)+"m":"$"+Math.round(n/1000)+"k";
const clone=o=>JSON.parse(JSON.stringify(o));
const EVTYPES={rate:"Interest rate",inc1:"Your take-home",inc2:"Wife's take-home",living:"Living costs",extra:"Extra into offset",bonus:"Yearly bonus",sweep:"Sweep surplus"};
const evVal=(t,v)=>t==="rate"?Number(v).toFixed(2)+"%":t==="sweep"?(v?"on":"off"):fmt(v)+(t==="bonus"?"/yr":"/mo");
const evText=(e)=>html`From <b>${e.month?label(ym(e.month)):"?"}</b>${e.until?html` until <b>${label(ym(e.until))}</b>`:""}, ${EVTYPES[e.type].toLowerCase()} becomes <b>${evVal(e.type,e.value)}</b>${e.until?", then reverts":""}`;
/* Expand timeline entries: a ranged entry adds an end event that restores the value in effect before it started. */
function expandEvents(s){
  const base={rate:s.rate,inc1:s.inc1,inc2:s.inc2,living:s.living,extra:s.extra,bonus:s.bonus,sweep:s.sweep?1:0};
  const starts=s.events.filter(e=>e.month).map(e=>({idx:ym(e.month),type:e.type,value:e.value,until:e.until&&ym(e.until)>ym(e.month)?ym(e.until)+1:null})).sort((a,b)=>a.idx-b.idx);
  const out=[],cur={...base},ends=[];
  const flushEnds=upto=>{ends.sort((a,b)=>a.idx-b.idx);while(ends.length&&ends[0].idx<=upto){const en=ends.shift();cur[en.type]=en.value;out.push({idx:en.idx,type:en.type,value:en.value,end:true});}};
  starts.forEach(e=>{flushEnds(e.idx);if(e.until)ends.push({idx:e.until,type:e.type,value:cur[e.type]});cur[e.type]=e.value;out.push({idx:e.idx,type:e.type,value:e.value});});
  flushEnds(Infinity);
  return out.sort((a,b)=>a.idx-b.idx);
}
const DEFAULTS={loan:1104000,rate:6.2,term:30,start:"2026-12",offset0:71000,
  inc1:9500,inc2:8000,living:6000,sac1:350,sac2:350,tax:35,growth:0,
  extra:2000,sweep:false,bonus:0,bonusM:7,oneoffs:[],events:[],
  kids:[{name:"Greesha",monthly:300,start:"2026-12",uni:2034},{name:"Son",monthly:300,start:"2026-12",uni:2038}],
  kidsInOffset:true,eduRate:4,uniYears:3};
function myDefaults(){try{const d=JSON.parse(localStorage.getItem("ttp-defaults")||"null");if(d&&d.kids)return Object.assign(clone(DEFAULTS),d);}catch(e){}return null;}
function loadState(){try{const s=JSON.parse(localStorage.getItem("ttp-state2")||"null");if(s&&s.kids)return Object.assign(clone(DEFAULTS),s);}catch(e){}return myDefaults()||clone(DEFAULTS);}
function loadScen(){try{return JSON.parse(localStorage.getItem("ttp-scen")||"[]")||[];}catch(e){return [];}}

/* ---------- model ---------- */
function annuity(P,r,n){return r===0?P/n:P*r/(1-Math.pow(1+r,-n));}
function run(s,scenario){
  const n=s.term*12, startIdx=ym(s.start);
  const sacCost=(s.sac1+s.sac2)*(1-s.tax/100);
  const kidsPay=s.kids.reduce((a,k)=>a+k.monthly,0);
  const live={rate:s.rate,inc1:s.inc1,inc2:s.inc2,living:s.living,extra:s.extra,bonus:s.bonus,sweep:s.sweep?1:0};
  const evs=expandEvents(s);
  let r=live.rate/100/12, pay=annuity(s.loan,r,n);
  let B=s.loan, O=scenario?s.offset0:0, E=s.kids.map(()=>0), wd=s.kids.map(()=>0);
  let totalInt=0,yearInt=0,paid=null,ei=0; const rows=[],pts=[],marks=[]; let first=null;
  for(let m=0;m<n;m++){
    const idx=startIdx+m, mo=idx%12, yr=Math.floor(idx/12), g=Math.pow(1+s.growth/100,Math.floor(m/12));
    while(ei<evs.length&&evs[ei].idx<=idx){const e=evs[ei++];if(e.idx===idx)marks.push({m,type:e.type,end:!!e.end});
      if(e.type==="rate"){if(e.value!==live.rate){live.rate=e.value;r=live.rate/100/12;pay=annuity(B,r,n-m);}}else live[e.type]=e.value;}
    const eduOff=(scenario&&s.kidsInOffset)?E.reduce((a,b)=>a+b,0):0;
    const interest=Math.max(0,B-O-eduOff)*r; totalInt+=interest; yearInt+=interest;
    B=Math.max(0,B+interest-pay);
    const take=(live.inc1+live.inc2)*g-sacCost;
    const room=Math.max(0,take-pay-live.living*g-kidsPay);
    const extra=live.sweep?room:Math.min(live.extra*g,room);
    if(scenario){
      O+=extra; if(live.bonus&&mo===s.bonusM-1)O+=live.bonus;
      s.oneoffs.forEach(o=>{if(o.month&&ym(o.month)===idx)O+=o.amount;});
      s.kids.forEach((k,i)=>{const u=k.uni*12+1;
        if(k.start&&idx>=ym(k.start)&&idx<u)E[i]+=k.monthly;
        if(idx===u)wd[i]=E[i]/(s.uniYears*12);
        if(idx>=u&&E[i]>0)E[i]=Math.max(0,E[i]-wd[i]);
        if(idx<u){if(s.kidsInOffset){const t=E[i]*r;if(O>=t){O-=t;E[i]+=t;}}else E[i]+=E[i]*(s.eduRate/100/12);}});
    }
    const ksum=E.reduce((a,b)=>a+b,0), net=Math.max(0,B-O);
    pts.push({m,idx,B,O,net,kids:ksum,rate:live.rate,pay});
    if(m===0)first={pay,rate:live.rate,take,extra,living:live.living*g};
    if(mo===11||m===n-1||B-O<=0){rows.push({year:yr,rate:live.rate,pay,B,O,net,kids:ksum,yearInt});yearInt=0;}
    if(paid===null&&B-O<=0){paid=m;break;}
  }
  return {pay,paidMonth:paid===null?n:paid,totalInt,rows,pts,marks,startIdx,sacCost,kidsPay,first};
}
function kidAtUni(s){
  const startIdx=ym(s.start), evs=expandEvents(s).filter(e=>e.type==="rate");
  let r=s.rate/100/12,ei=0,E=s.kids.map(()=>0),C=s.kids.map(()=>0),out=s.kids.map(()=>({value:0,contrib:0}));
  const end=Math.max(startIdx+1,...s.kids.map(k=>k.uni*12+1));
  for(let idx=startIdx;idx<end;idx++){
    while(ei<evs.length&&evs[ei].idx<=idx)r=evs[ei++].value/100/12;
    s.kids.forEach((k,i)=>{const u=k.uni*12+1;if(idx>=u)return;
      if(k.start&&idx>=ym(k.start)){E[i]+=k.monthly;C[i]+=k.monthly;}
      E[i]+=E[i]*(s.kidsInOffset?r:s.eduRate/100/12);
      if(idx===u-1){out[i].value=E[i];out[i].contrib=C[i];}});
  }
  return out;
}

/* ---------- small components ---------- */
function Num({label,value,onChange,min,max,step,unit="$",cls="",hint,fmtv}){
  const [txt,setTxt]=useState(String(value));
  useEffect(()=>{setTxt(String(value));},[value]);
  const commit=()=>{const v=Number(txt);if(!isNaN(v))onChange(v);else setTxt(String(value));};
  return html`<div class="f ${cls}"><div class="lab"><span>${label}</span><span class="unit">${fmtv?fmtv(value):unit==="$"?fmt(value):value+unit}</span></div>
    <div class="ctl"><input type="range" min=${min} max=${max} step=${step} value=${value} onInput=${e=>onChange(Number(e.target.value))} aria-label=${label} />
    <input type="number" step=${step} value=${txt} onInput=${e=>setTxt(e.target.value)} onBlur=${commit} onKeyDown=${e=>{if(e.key==="Enter")commit();}} aria-label=${label+" exact"} /></div>
    ${hint&&html`<p class="hint">${hint}</p>`}</div>`;
}
function Plain({label,type="number",value,onChange,step,min,max}){
  return html`<div class="f"><div class="lab"><span>${label}</span></div><input type=${type} step=${step} min=${min} max=${max} value=${value} onInput=${e=>onChange(type==="number"?Number(e.target.value):e.target.value)} aria-label=${label} /></div>`;
}
function Check({label,checked,onChange}){return html`<label class="toggle"><input type="checkbox" checked=${checked} onChange=${e=>onChange(e.target.checked)} /><span>${label}</span></label>`;}

/* ---------- input tabs ---------- */
function LoanTab({s,set}){
  return html`<${React.Fragment}>
    <${Num} label="Loan amount incl. LMI" value=${s.loan} min=${900000} max=${1200000} step=${1000} onChange=${v=>set("loan",v)} />
    <${Num} label="Starting interest rate" value=${s.rate} min=${3} max=${10} step=${0.05} unit="%" onChange=${v=>set("rate",v)} hint="Later rate moves go on the Timeline tab. The repayment is recalculated on the remaining term each time, as a lender does." />
    <div class="row2"><${Plain} label="Term (years)" value=${s.term} min=${10} max=${40} step=${1} onChange=${v=>set("term",v)} />
      <${Plain} label="First repayment" type="month" value=${s.start} onChange=${v=>set("start",v)} /></div>
    <${Num} cls="off" label="Cash in offset at settlement" value=${s.offset0} min=${0} max=${150000} step=${1000} onChange=${v=>set("offset0",v)} hint="Emergency fund plus any investments you sell. Money here cancels interest on the same amount of loan." />
  <//>`;
}
function BudgetTab({s,set}){
  return html`<${React.Fragment}>
    <div class="row2"><${Plain} label="Your take-home / month" value=${s.inc1} step=${100} onChange=${v=>set("inc1",v)} /><${Plain} label="Wife's take-home / month" value=${s.inc2} step=${100} onChange=${v=>set("inc2",v)} /></div>
    <p class="hint">These are the base figures. A pay rise, a period on one income or parental leave goes on the Timeline tab with a start and, if temporary, an end month.</p>
    <${Num} label="Living costs / month (everything but the loan)" value=${s.living} min=${2000} max=${12000} step=${100} onChange=${v=>set("living",v)} />

/* ---------- chart ---------- */
const SERIES=[["B","Loan balance","--loan"],["O","House offset","--offset"],["net","Net debt","--fg"],["base","Net debt, nothing extra","--muted",true],["kids","Kids' funds","--kids"]];
function Chart({sc,base,scens,tok}){
  const [on,setOn]=useState({B:true,O:true,net:true,base:true,kids:true});
  if(!R)return html`<p class="note">Chart library did not load.</p>`;
  const {ComposedChart,Line,Area,XAxis,YAxis,Tooltip,CartesianGrid,ReferenceLine,ResponsiveContainer}=R;
  const len=Math.max(sc.pts.length,base.pts.length,...scens.map(x=>x.res.pts.length));
  const data=[];
  for(let m=0;m<len;m+=1){const p=sc.pts[m],b=base.pts[m];const row={m,idx:sc.startIdx+m,B:p?p.B:null,O:p?p.O:null,net:p?p.net:null,kids:p?p.kids:null,base:b?b.net:null,rate:p?p.rate:null,pay:p?p.pay:null};
    scens.forEach((x,i)=>{const q=x.res.pts[m];row["s"+i]=q?q.net:null;});data.push(row);}
  const yrs=[];for(let m=0;m<len;m+=12)yrs.push(m);
  const Tip=({active,payload})=>{if(!active||!payload||!payload.length)return null;const d=payload[0].payload;
    return html`<div class="tip"><b>${label(d.idx)}${d.rate!=null?" · "+d.rate.toFixed(2)+"% · repay "+fmt(d.pay):""}</b>
      ${d.B!=null&&html`<span>Loan balance</span><span>${fmt(d.B)}</span>`}${d.O!=null&&html`<span>House offset</span><span>${fmt(d.O)}</span>`}
      ${d.net!=null&&html`<span>Net debt</span><span>${fmt(d.net)}</span>`}${d.kids!=null&&html`<span>Kids' funds</span><span>${fmt(d.kids)}</span>`}
      ${d.base!=null&&html`<span>Nothing extra</span><span>${fmt(d.base)}</span>`}
      ${scens.map((x,i)=>d["s"+i]!=null&&html`<span key=${i}>${x.name}</span><span>${fmt(d["s"+i])}</span>`)}</div>`;};
  const alts=["--alt","--kids","--offset"];
  return html`<${React.Fragment}>
    <div class="legend">${SERIES.map(([k,n,c,dash])=>html`<button key=${k} aria-pressed=${on[k]} onClick=${()=>setOn({...on,[k]:!on[k]})} style=${{"--c":"var("+c+")"}}><i class=${dash?"dash":""}></i>${n}</button>`)}
      ${scens.map((x,i)=>html`<button key=${"s"+i} aria-pressed="true" style=${{"--c":"var("+alts[i%3]+")"}}><i class="dash"></i>${x.name}</button>`)}</div>
    <div class="chartbox"><${ResponsiveContainer} width="100%" height="100%">
      <${ComposedChart} data=${data} margin=${{top:10,right:14,left:4,bottom:0}}>
        <${CartesianGrid} stroke=${tok("--line")} vertical=${false} />
        <${XAxis} dataKey="m" ticks=${yrs.filter((_,i)=>i%(len>240?5:len>120?2:1)===0)} tickFormatter=${m=>String(Math.floor((sc.startIdx+m)/12))} stroke=${tok("--muted")} tick=${{fontSize:11,fontFamily:"IBM Plex Mono, monospace"}} tickLine=${false} axisLine=${{stroke:tok("--line")}} />
        <${YAxis} tickFormatter=${fmtK} stroke=${tok("--muted")} tick=${{fontSize:11,fontFamily:"IBM Plex Mono, monospace"}} tickLine=${false} axisLine=${false} width=${56} />
        <${Tooltip} content=${Tip} cursor=${{stroke:tok("--muted"),strokeDasharray:"3 3"}} />
        ${sc.marks.map((mk,i)=>html`<${ReferenceLine} key=${i} x=${mk.m} stroke=${tok(mk.end?"--muted":"--warn")} strokeDasharray=${mk.end?"2 5":"3 4"} />`)}
        <${ReferenceLine} x=${sc.paidMonth} stroke=${tok("--loan")} label=${{value:"Paid off "+label(sc.startIdx+sc.paidMonth),position:"insideTopRight",fill:tok("--fg"),fontSize:12,fontWeight:600}} />
        ${on.kids&&html`<${Area} type="monotone" dataKey="kids" stroke=${tok("--kids")} fill=${tok("--kids-soft")} strokeWidth=${1.8} dot=${false} isAnimationActive=${false} connectNulls=${false} />`}
        ${on.base&&html`<${Line} type="monotone" dataKey="base" stroke=${tok("--muted")} strokeDasharray="4 4" strokeWidth=${1.6} dot=${false} isAnimationActive=${false} />`}
        ${on.B&&html`<${Line} type="monotone" dataKey="B" stroke=${tok("--loan")} strokeWidth=${1.8} dot=${false} isAnimationActive=${false} />`}
        ${on.O&&html`<${Line} type="monotone" dataKey="O" stroke=${tok("--offset")} strokeWidth=${1.8} dot=${false} isAnimationActive=${false} />`}
        ${on.net&&html`<${Line} type="monotone" dataKey="net" stroke=${tok("--fg")} strokeWidth=${2.4} dot=${false} isAnimationActive=${false} />`}
        ${scens.map((x,i)=>html`<${Line} key=${"s"+i} type="monotone" dataKey=${"s"+i} stroke=${tok(alts[i%3])} strokeDasharray="6 3" strokeWidth=${1.8} dot=${false} isAnimationActive=${false} />`)}
      <//>
    <//></div>
  <//>`;
}

/* ---------- app ---------- */
function App(){
  const [s,setS]=useState(loadState);
  const [tab,setTab]=useState("Loan");
  const [scens,setScens]=useState(loadScen);
  const [toast,setToast]=useState(null);
  const [,bump]=useState(0);
  useEffect(()=>{try{localStorage.setItem("ttp-state2",JSON.stringify(s));}catch(e){}},[s]);
  useEffect(()=>{try{localStorage.setItem("ttp-scen",JSON.stringify(scens));}catch(e){}},[scens]);
  useEffect(()=>{if(!window.matchMedia)return;const mq=window.matchMedia("(prefers-color-scheme: dark)");const f=()=>bump(x=>x+1);mq.addEventListener("change",f);return()=>mq.removeEventListener("change",f);},[]);
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(null),1800);return()=>clearTimeout(t);}},[toast]);
  const set=(k,v)=>setS(p=>({...p,[k]:v}));
  const css=getComputedStyle(document.documentElement),tok=n=>css.getPropertyValue(n).trim();

  const sc=useMemo(()=>run(s,true),[s]);
  const base=useMemo(()=>run(s,false),[s]);
  const ku=useMemo(()=>kidAtUni(s),[s]);
  const scenRes=useMemo(()=>scens.map(x=>({...x,res:run(x.state,true)})),[scens]);
  const f=sc.first, left=f.take-f.pay-f.living-sc.kidsPay-f.extra;
  const oneInc=Math.max(s.inc1,s.inc2)-sc.sacCost-f.pay-f.living;
  const maxPay=Math.max(...sc.rows.map(r=>r.pay)),minPay=Math.min(...sc.rows.map(r=>r.pay));
  const vary=fn=>{const c=clone(s);fn(c);return run(c,true);};
  const tests=useMemo(()=>[
    ["Rate 1% higher throughout",vary(c=>{c.rate+=1;c.events.forEach(e=>{if(e.type==="rate")e.value+=1;});})],
    ["Rate 1% lower throughout",vary(c=>{c.rate-=1;c.events.forEach(e=>{if(e.type==="rate")e.value-=1;});})],
    ["$500 a month less into the offset",vary(c=>{c.sweep=false;c.extra=Math.max(0,f.extra-500);c.events=c.events.filter(e=>e.type!=="extra"&&e.type!=="sweep");})],
    ["$500 a month more into the offset",vary(c=>{c.sweep=false;c.extra=f.extra+500;c.events=c.events.filter(e=>e.type!=="extra"&&e.type!=="sweep");})],
    ["No timeline changes",vary(c=>{c.events=[];})],
    ["Kids' funds kept outside the offset",vary(c=>{c.kidsInOffset=false;})],
    ["No kids' funds at all",vary(c=>{c.kids.forEach(k=>k.monthly=0);})],
    ["Sold nothing: $21,000 in offset at start",vary(c=>{c.offset0=21000;})],
  ],[s]);
  const cmp=scenRes[0];
  const diff=(a,b,good)=>{const d=a-b;if(Math.abs(d)<0.05)return null;return html`<span class=${"d "+((good?d>0:d<0)?"good":"bad")}>${d>0?"+":"−"}${typeof good==="string"?fmtK(Math.abs(d)):Math.abs(d).toFixed(1)+" yrs"} vs ${cmp.name}</span>`;};
  const tabs={Loan:LoanTab,Budget:BudgetTab,Offset:OffsetTab,Timeline:TimelineTab,Kids:KidsTab,Config:ConfigTab};
  const TabBody=tabs[tab];
  const saveScen=()=>{if(scens.length>=3){setToast("Up to 3 saved scenarios. Remove one first.");return;}const name="Plan "+String.fromCharCode(65+scens.length);setScens([...scens,{name,state:clone(s)}]);setToast(name+" saved");};

  return html`<${React.Fragment}>
    <header><div><h1>Timbertop Loan Planner</h1><p>Drag a slider or type a number and everything updates. Hover the chart for any month. Save a plan, change things, and compare.</p></div>
      <div class="chips"><button class="primary" onClick=${saveScen}>Save this as a plan to compare</button><button onClick=${()=>{setS(myDefaults()||clone(DEFAULTS));setToast("Reset to defaults");}}>Reset to defaults</button></div></header>
    <div class="layout">
      <aside class="panel" aria-label="Inputs">
        <div class="tabs" role="tablist">${Object.keys(tabs).map(t=>html`<button key=${t} role="tab" aria-selected=${tab===t} onClick=${()=>setTab(t)}>${t}${t==="Timeline"&&s.events.length?" ("+s.events.length+")":""}</button>`)}</div>
        <div class="tabbody"><${TabBody} s=${s} set=${set} setS=${setS} toast=${setToast} /></div>
      </aside>
      <main class="results">
        <div class="tiles">
          <div class="tile hero"><div class="k">Effectively paid off</div><div class="v">${label(sc.startIdx+sc.paidMonth)}</div><div class="s">${(sc.paidMonth/12).toFixed(1)} years from the first repayment</div>${cmp&&diff(cmp.res.paidMonth/12,sc.paidMonth/12,true)}</div>
          <div class="tile"><div class="k">Years saved</div><div class="v">${((base.paidMonth-sc.paidMonth)/12).toFixed(1)}</div><div class="s">versus the full term with nothing extra</div></div>
          <div class="tile"><div class="k">Interest saved</div><div class="v">${fmtK(base.totalInt-sc.totalInt)}</div><div class="s">you pay ${fmtK(sc.totalInt)} instead of ${fmtK(base.totalInt)}</div>${cmp&&diff(cmp.res.totalInt,sc.totalInt,"money")}</div>
          <div class="tile"><div class="k">Repayment now</div><div class="v">${fmt(f.pay)}</div><div class="s">${(f.pay/(s.inc1+s.inc2)*100).toFixed(0)}% of take-home${maxPay-minPay>1?" · "+fmt(minPay)+" to "+fmt(maxPay)+" over the loan":""}</div></div>
        </div>

        <section class="card">
          <div class="card-head"><h2>Loan, offset and kids' funds over time</h2></div>
          <${Chart} sc=${sc} base=${base} scens=${scenRes} tok=${tok} />
          <p class="note">"Effectively paid off" is when the house offset equals the loan balance: from then on no interest is charged. Red dashed lines mark timeline changes. Click a legend item to hide or show it.</p>
        </section>

        ${scens.length>0&&html`<section class="card"><div class="card-head"><h2>Saved plans</h2><span class="hint">Current settings are compared against each</span></div>
          <div class="tablewrap"><table><thead><tr><th>Plan</th><th>Paid off</th><th>Interest paid</th><th>Extra / mo</th><th>Rate</th><th>Offset at start</th><th>Kids / mo</th><th></th></tr></thead><tbody>
            <tr><td><b>Current</b></td><td>${label(sc.startIdx+sc.paidMonth)}</td><td>${fmtK(sc.totalInt)}</td><td>${fmt(f.extra)}</td><td>${s.rate.toFixed(2)}%${s.events.some(e=>e.type==="rate")?"*":""}</td><td>${fmt(s.offset0)}</td><td>${fmt(sc.kidsPay)}</td><td></td></tr>
            ${scenRes.map((x,i)=>html`<tr key=${i}><td>${x.name}</td><td>${label(x.res.startIdx+x.res.paidMonth)}</td><td>${fmtK(x.res.totalInt)}</td><td>${fmt(x.res.first.extra)}</td><td>${x.state.rate.toFixed(2)}%${x.state.events.some(e=>e.type==="rate")?"*":""}</td><td>${fmt(x.state.offset0)}</td><td>${fmt(x.res.kidsPay)}</td>
              <td style=${{textAlign:"right"}}><button onClick=${()=>{setS(clone(x.state));setToast("Loaded "+x.name);}}>Load</button> <button class="x" aria-label="Remove" onClick=${()=>setScens(scens.filter((_,j)=>j!==i))}>✕</button></td></tr>`)}
          </tbody></table></div><p class="hint">* has rate changes on its timeline</p></section>`}

        <div class="two">
          <section class="card">
            <div class="card-head"><h2>Where each month's pay goes</h2><span class=${"pill "+(left<0?"bad":left<500?"warn":"")}>${left<0?"Over budget":left<500?"Fully allocated":fmt(left)+" spare"}</span></div>
            <p class="hint">First month, ${label(sc.startIdx)}. Later months follow your timeline.</p>
            <div class="bar">${[[f.pay,"--loan"],[f.living,"--muted"],[sc.kidsPay,"--kids"],[f.extra,"--offset"]].map(([v,c],i)=>html`<i key=${i} style=${{width:Math.max(0,Math.min(100,v/f.take*100))+"%",background:"var("+c+")"}}></i>`)}</div>
            <div class="budget">
              <div>Take-home (after salary sacrifice)</div><div>${fmt(f.take)}</div>
              <div>Loan repayment</div><div>− ${fmt(f.pay)}</div>
              <div>Living costs</div><div>− ${fmt(f.living)}</div>
              <div>Kids' funds</div><div>− ${fmt(sc.kidsPay)}</div>
              <div>Extra into offset</div><div>− ${fmt(f.extra)}</div>
              <div class="sum">Unallocated each month</div><div class=${"sum "+(left<0?"neg":"")}>${left<0?"− "+fmt(-left):fmt(left)}</div>
            </div>
            <p class="note">On the larger income alone, after the repayment and living costs you would have ${oneInc<0?"a shortfall of "+fmt(-oneInc):fmt(oneInc)+" a month"}. The offset at settlement covers ${(s.offset0/(f.pay+f.living)).toFixed(1)} months of repayments and living costs.</p>
          </section>
          <section class="card">
            <h2>What if one thing changed</h2>
            <div class="budget">${tests.map(([k,r])=>{const d=(r.paidMonth-sc.paidMonth)/12,di=r.totalInt-sc.totalInt;
              return html`<${React.Fragment} key=${k}><div>${k}</div><div class=${di>500?"neg":""}>${label(r.startIdx+r.paidMonth)} · ${d>0?"+":""}${d.toFixed(1)} yrs · ${di>=0?"+":"−"}${fmtK(Math.abs(di))}</div><//>`;})}</div>
            <p class="note">Each line changes one thing and keeps everything else as set. A higher rate can show an earlier payoff because the bank raises the compulsory repayment; the interest figure is the true cost.</p>
          </section>
        </div>

        <section class="card"><h2>Kids' funds at university start</h2>
          <div class="kids">${s.kids.map((k,i)=>{const v=ku[i].value,c=ku[i].contrib,yrs=Math.max(0,(k.uni*12+1-ym(k.start||s.start))/12);
            return html`<div class="tile kidcard" key=${i}><div class="k">${k.name||"Child "+(i+1)} · university ${k.uni}</div><div class="big">${fmt(v)}</div>
              <dl><dt>You put in</dt><dd>${fmt(c)}</dd><dt>Growth (${s.kidsInOffset?"interest saved at the loan rate":s.eduRate+"% after tax"})</dt><dd>${fmt(v-c)}</dd>
              <dt>Years of saving</dt><dd>${yrs.toFixed(1)}</dd><dt>Per year at uni (${s.uniYears} yrs)</dt><dd>${fmt(v/s.uniYears)}</dd></dl>
              <p class="hint">Living at home, allow roughly $5,000 to $6,500 a year in ${k.uni} for books, transport, a laptop and spending money. Course fees can go on HECS-HELP.</p></div>`;})}</div>
        </section>

        <section class="card"><div class="card-head"><h2>Year by year</h2><span class="hint">Balances at the end of each year</span></div>
          <div class="tablewrap"><table><thead><tr><th>Year</th><th>Rate</th><th>Repayment</th><th>Loan balance</th><th>House offset</th><th>Net debt</th><th>Kids' funds</th><th>Interest that year</th></tr></thead>
            <tbody>${sc.rows.map(r=>html`<tr key=${r.year} class=${r.net<=0?"paid":""}><td>${r.year}</td><td>${r.rate.toFixed(2)}%</td><td>${fmt(r.pay)}</td><td>${fmt(r.B)}</td><td>${fmt(r.O)}</td><td>${fmt(r.net)}</td><td>${fmt(r.kids)}</td><td>${fmt(r.yearInt)}</td></tr>`)}</tbody></table></div>
        </section>
      </main>
    </div>
    ${toast&&html`<div class="toast" role="status">${toast}</div>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>

</body>
</html>
